name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check core and package universal app
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Awake-preview
          path: |
            dist/Agent-Awake-*-macos-universal.zip
            dist/SHA256SUMS.txt
