name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check core and build native app
        run: |
          scripts/check.sh
          scripts/build-app.sh
      - name: Archive local preview
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Agent Awake.app' dist/Agent-Awake-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Awake-preview
          path: dist/Agent-Awake-preview.zip
